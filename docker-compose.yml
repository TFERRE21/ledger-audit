services:
  app:
    build: .
    container_name: ledger-audit
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ledger-audit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger_audit
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ledger_audit_pg:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger_audit_pg:
